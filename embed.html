<!DOCTYPE html>
<!--
  PLAYER EMBED (carregado por iframe): video HLS da Bunny Stream com "smart autoplay" estilo vTurb.
  Uso: embed.html?v=<guid do video na Bunny>. Snippet pra colar e trava por dominio: LEIA-ME.md.
  Mesmo comportamento do player da pagina\index.html: toca mudo com aviso piscando; 1o toque volta
  pro 0:00 com som; depois cada toque pausa/continua; sem barra de seek.
-->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Video</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}

  /* caixa = iframe inteiro: toque em qualquer ponto conta */
  .box{position:relative;width:100%;height:100%;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  .box.off{cursor:default}
  .box video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;background:#000}

  /* aviso "video tocando mudo": caixa amarela centralizada, some no 1o toque.
     Tamanhos em vw (= largura do iframe) com clamp(): legivel de 280 a 420 px */
  .vsl-notice,.vsl-play{appearance:none;-webkit-appearance:none;margin:0;padding:0;border:0}
  .vsl-notice{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;
    display:flex;flex-direction:column;align-items:center;gap:clamp(6px,2.6vw,10px);
    width:80%;max-width:300px;padding:clamp(12px,5vw,22px) clamp(10px,4.5vw,20px);
    background:#FFCC00;border:3px solid #000;border-radius:clamp(10px,4vw,14px);
    font-family:inherit;cursor:pointer;
  }
  .vsl-notice-icon{width:clamp(24px,9.5vw,38px);height:clamp(24px,9.5vw,38px)}
  .vsl-notice-text{margin:0;color:#000;font-weight:800;text-transform:uppercase;text-align:center;font-size:clamp(14px,5.2vw,21px);line-height:1.3}
  .vsl-notice-sub{display:block;margin-top:clamp(4px,1.6vw,6px);font-size:clamp(12px,4vw,16px);font-weight:700}
  /* pisca enquanto o video roda mudo: caixa pulsa, icone do alto-falante acende/apaga */
  .vsl-notice{animation:vsl-pulse 1s ease-in-out infinite}
  .vsl-notice-icon{animation:vsl-blink 1s steps(1) infinite}
  @keyframes vsl-pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.08)}}
  @keyframes vsl-blink{50%{opacity:0}}

  /* botao de play grande: so aparece quando o usuario pausa (depois do desbloqueio do audio) */
  .vsl-play{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;
    width:clamp(56px,20vw,84px);height:clamp(56px,20vw,84px);border-radius:50%;
    background:rgba(0,0,0,.55);border:3px solid #FFFFFF;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .vsl-play svg{width:40%;height:40%}
  .vsl-notice[hidden],.vsl-play[hidden],.erro[hidden]{display:none}

  /* guid invalido/ausente */
  .erro{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);margin:0;padding:0 16px;color:#BBBBBB;text-align:center;font-size:clamp(14px,4.5vw,18px);line-height:1.4}
</style>
</head>
<body>

<div class="box" id="vsl-box">
  <video id="vsl-video" muted autoplay playsinline webkit-playsinline preload="auto"></video>

  <button type="button" id="vsl-notice" class="vsl-notice" aria-label="Tocca per attivare l'audio" hidden>
    <svg class="vsl-notice-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M11 5 6 9H2v6h4l5 4V5z" fill="#000"></path>
      <line x1="23" y1="9" x2="17" y2="15" stroke="#D81E1E" stroke-width="2.6" stroke-linecap="round"></line>
      <line x1="17" y1="9" x2="23" y2="15" stroke="#D81E1E" stroke-width="2.6" stroke-linecap="round"></line>
    </svg>
    <span class="vsl-notice-text">IL TUO VIDEO È INIZIATO!<span class="vsl-notice-sub">TOCCA QUI PER ASCOLTARE!</span></span>
  </button>

  <button type="button" id="vsl-play" class="vsl-play" aria-label="Riprendi il video" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="#fff"></path></svg>
  </button>

  <p id="vsl-erro" class="erro" hidden>Video non disponibile</p>
</div>

<script>
(function () {
  'use strict';
  var CDN = 'https://vz-6935c328-5a0.b-cdn.net/'; // biblioteca Bunny Stream
  var HLSJS_SRC = 'https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js'; // versao fixa, nao "latest"
  var UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

  var box = document.getElementById('vsl-box');
  var video = document.getElementById('vsl-video');
  var notice = document.getElementById('vsl-notice');
  var playBtn = document.getElementById('vsl-play');
  var erro = document.getElementById('vsl-erro');

  // guid vem de ?v= ; formato invalido = mensagem neutra e nada carrega
  var m = /[?&]v=([^&#]*)/.exec(location.search);
  var guid = m ? m[1] : '';
  if (!UUID.test(guid)) {
    video.removeAttribute('autoplay');
    box.className += ' off';
    erro.hidden = false;
    return;
  }
  guid = guid.toLowerCase();
  var HLS_URL = CDN + guid + '/playlist.m3u8';
  video.poster = CDN + guid + '/thumbnail.jpg';
  notice.hidden = false;

  var unlocked = false; // true depois do 1o toque (audio liberado)
  var hls = null; // instancia ativa do hls.js; null quando usa HLS nativo (Safari/iOS)
  var pendingPlay = null; // promise do play() em curso
  var busy = false; // trava toque duplo/rajada (double-tap) enquanto o anterior ainda esta em voo
  var pausedByUs = false; // pausamos nos (aba em 2o plano), nao o usuario: so esse caso retoma sozinho
  var tentativasRecovery = 0; // limite pra recuperacao de erro nao martelar pra sempre

  function tentaTocar(comAudio) {
    video.muted = !comAudio;
    var p = video.play();
    pendingPlay = (p && typeof p.catch === 'function')
      ? p.catch(function () { /* autoplay bloqueado (economia de bateria/dados): fica no poster com o aviso */ })
      : null;
    return pendingPlay || Promise.resolve();
  }

  // nunca chama pause() com um play() ainda em voo: essa sobreposicao e a causa classica (Chrome/MSE
  // e Safari/AVPlayer) do video travar num frame congelado enquanto o audio continua tocando sozinho
  function pausaSegura() {
    var espera = pendingPlay || Promise.resolve();
    return espera.then(function () { try { video.pause(); } catch (e) {} }, function () { try { video.pause(); } catch (e) {} });
  }

  // recuperacao de erro: sem isso, qualquer solavanco de rede ou decode vira travamento permanente
  // (o player nunca tinha handler nenhum de erro antes desta correcao)
  function recuperar() {
    if (tentativasRecovery >= 3) return; // desiste depois de 3 tentativas: nao martela pra sempre
    tentativasRecovery++;
    var ct = video.currentTime || 0;
    var tocando = !video.paused;
    if (hls) {
      try { hls.recoverMediaError ? hls.recoverMediaError() : hls.startLoad(); } catch (e) {}
    } else {
      // nativo: currentTime so pode ser aplicado DEPOIS do loadedmetadata (setar antes e ignorado/
      // zerado pelo navegador) -- aplicar direto feito na 1a versao desta correcao voltava o video pro 0
      try {
        video.addEventListener('loadedmetadata', function aoCarregar() {
          video.removeEventListener('loadedmetadata', aoCarregar);
          try { video.currentTime = ct; } catch (e) {}
          if (tocando) tentaTocar(!video.muted);
        });
        video.src = HLS_URL;
        video.load();
      } catch (e) {}
    }
  }

  // deteccao igual ao vsl/player.html (mesma base de codigo, ja testada): iOS/iPadOS e Safari de
  // verdade usam o HLS nativo (AVFoundation); todo o resto tenta hls.js (MSE) primeiro. Importante:
  // canPlayType('application/vnd.apple.mpegurl') hoje responde truthy tambem em Chrome/Chromium
  // (desktop recente e Android ha varias versoes) -- usar canPlayType como 1o criterio jogava esses
  // navegadores pro decoder nativo do Chrome em vez do hls.js, e o nativo do Chrome e o suspeito
  // mais provavel do "pausa e trava com audio fantasma" (pipeline HLS nativo dele e bem menos
  // maduro que MSE+hls.js). canPlayType so entra como ULTIMO recurso, se nem hls.js estiver disponivel.
  var ua = navigator.userAgent || '';
  var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isSafari = /^((?!chrome|crios|fxios|android|edg).)*safari/i.test(ua);
  window.__vslBranch = null; // exposto so pra teste/medicao (headless); nao afeta produto

  function tocaNativo(ramo) {
    window.__vslBranch = ramo;
    video.src = HLS_URL;
    video.addEventListener('error', recuperar);
    tentaTocar(unlocked);
  }

  function iniciaHls() {
    if (isIOS || isSafari) { tocaNativo('native-ios-safari'); return; }
    var script = document.createElement('script');
    script.src = HLSJS_SRC;
    // CDN do hls.js fora do ar/bloqueado: cai no nativo em vez de deixar a VSL em branco
    script.onerror = function () {
      if (video.canPlayType('application/vnd.apple.mpegurl')) tocaNativo('native-cdn-fail');
    };
    script.onload = function () {
      if (window.Hls && window.Hls.isSupported()) {
        window.__vslBranch = 'hlsjs';
        hls = new window.Hls();
        hls.loadSource(HLS_URL);
        hls.attachMedia(video);
        // se o toque chegou antes do manifest, aqui ja recomeca com o audio certo
        hls.on(window.Hls.Events.MANIFEST_PARSED, function () { tentaTocar(unlocked); });
        hls.on(window.Hls.Events.ERROR, function (event, data) {
          if (!data || !data.fatal) return;
          if (data.type === window.Hls.ErrorTypes.NETWORK_ERROR) { try { hls.startLoad(); } catch (e) {} }
          else recuperar();
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // ultimo recurso: nem MSE/hls.js disponivel, mas o navegador alega suporte nativo
        tocaNativo('native-fallback');
      }
    };
    document.head.appendChild(script);
  }

  // toque em qualquer ponto (video, aviso ou play)
  box.addEventListener('click', function () {
    if (busy) return; // ignora toque duplo/rajada em cima do anterior ainda sendo processado
    busy = true;
    setTimeout(function () { busy = false; }, 250);
    if (!unlocked) {
      unlocked = true;
      notice.hidden = true;
      try { video.currentTime = 0; } catch (e) { /* metadados ainda nao carregados: ignora */ }
      tentaTocar(true);
      return;
    }
    if (video.paused) { playBtn.hidden = true; pausedByUs = false; tentaTocar(true); }
    else { pausaSegura(); playBtn.hidden = false; }
  });

  // aba/app em 2o plano: pausa de verdade e libera banda (stopLoad); so retoma sozinho se quem
  // pausou fomos nos (nunca sobrescreve uma pausa manual do usuario)
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      if (!video.paused) { pausedByUs = true; pausaSegura(); if (hls) { try { hls.stopLoad(); } catch (e) {} } }
    } else if (pausedByUs) {
      pausedByUs = false;
      if (hls) { try { hls.startLoad(); } catch (e) {} }
      tentaTocar(!video.muted);
    }
  });
  // saindo da pagina de vez: libera o hls.js pra nao deixar decoder/segmentos presos em memoria
  window.addEventListener('pagehide', function () {
    try { video.pause(); } catch (e) {}
    if (hls) { try { hls.destroy(); } catch (e) {} }
  });

  iniciaHls();
})();
</script>

</body>
</html>
